name: Screenshot

# `/screenshot [window title]` in a PR comment or description builds the PR on
# a macOS runner, optionally runs a setup block, and posts the window as a
# comment. Technotes/Testing.md has the syntax.

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, edited]

permissions: {}

concurrency:
  group: screenshot-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  request:
    # Only here. Who may ask is checked below, against their actual permission.
    # A description only counts on a branch of this repository, since a fork's
    # pull_request token cannot comment.
    if: >-
      github.repository == 'jansim/doctopus' && (
        (github.event_name == 'issue_comment'
          && github.event.issue.pull_request
          && contains(github.event.comment.body, '/screenshot'))
        || (github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && contains(github.event.pull_request.body, '/screenshot')
          && (github.event.action == 'opened' || github.event.changes.body)))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    outputs:
      specs: ${{ steps.parse.outputs.specs }}
      count: ${{ steps.parse.outputs.count }}
      pr: ${{ github.event.issue.number || github.event.pull_request.number }}
    steps:
      # The setup block is run as written, so only someone who could push that
      # code anyway may ask. author_association is not enough: COLLABORATOR
      # and MEMBER include read-only access. The sender is whoever wrote the
      # comment or edited the description, not the PR's author.
      - name: Check access
        id: access
        env:
          GH_TOKEN: ${{ github.token }}
          SENDER: ${{ github.event.sender.login }}
        run: |
          permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$SENDER/permission" --jq .permission)
          echo "$SENDER has $permission access"
          case "$permission" in
            admin|write) echo "allowed=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "::notice::Ignoring /screenshot from $SENDER, who cannot write to this repository" ;;
          esac

      - uses: actions/checkout@v4
        if: steps.access.outputs.allowed == 'true'
        with:
          sparse-checkout: .github/screenshot
          persist-credentials: false

      - name: Parse
        id: parse
        if: steps.access.outputs.allowed == 'true'
        env:
          BODY: ${{ github.event.comment.body || github.event.pull_request.body }}
          PREVIOUS: ${{ github.event.changes.body.from }}
          EDITED: ${{ github.event.action == 'edited' }}
        run: |
          python3 .github/screenshot/parse.py
          # An edit elsewhere in the description does not ask again.
          if [ "$EDITED" = true ]; then
            now=$(BODY="$BODY" GITHUB_OUTPUT='' python3 .github/screenshot/parse.py)
            was=$(BODY="$PREVIOUS" GITHUB_OUTPUT='' python3 .github/screenshot/parse.py)
            [ "$now" = "$was" ] && echo "count=0" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

      - name: Acknowledge
        if: github.event_name == 'issue_comment' && fromJSON(steps.parse.outputs.count || '0') > 0
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT: ${{ github.event.comment.id }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT/reactions" \
            -f content=eyes >/dev/null

  capture:
    needs: request
    if: fromJSON(needs.request.outputs.count || '0') > 0
    # Same toolchain as CI.
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.head.outputs.sha }}
    steps:
      - name: Check out the PR
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ needs.request.outputs.pr }}/head
          path: app
          persist-credentials: false

      # The harness comes from the workflow's own commit, not the PR.
      - name: Check out the harness
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/screenshot
          path: tools
          persist-credentials: false

      - id: head
        run: echo "sha=$(git -C app rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build
        working-directory: app
        run: Scripts/build.sh

      - name: Generate the demo library
        working-directory: app
        run: swift Testing/makefixtures.swift "$RUNNER_TEMP/DemoLibrary"

      - name: Window lister
        run: swiftc -O tools/.github/screenshot/windows.swift -o "$RUNNER_TEMP/windows"

      - name: Capture
        env:
          SPECS: ${{ needs.request.outputs.specs }}
          APP: ${{ github.workspace }}/app/build/Doctopus.app
          LIBRARY: ${{ runner.temp }}/DemoLibrary
          WINDOWS: ${{ runner.temp }}/windows
          OUT: ${{ runner.temp }}/screenshots
        run: python3 tools/.github/screenshot/capture.py

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore

  post:
    needs: [request, capture]
    if: always() && needs.request.result == 'success' && fromJSON(needs.request.outputs.count || '0') > 0
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Download
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: screenshots
          path: shots

      # Comments cannot carry uploads, so the images live on an orphan branch
      # and the comment links them by commit.
      - name: Publish images
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.request.outputs.pr }}
        run: |
          shopt -s nullglob
          pngs=(shots/*.png)
          [ ${#pngs[@]} -gt 0 ] || exit 0
          dir="pr-$PR/$GITHUB_RUN_ID"
          git init -q "$RUNNER_TEMP/pages" && cd "$RUNNER_TEMP/pages"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          if git fetch -q --depth=1 origin screenshots; then
            git checkout -q -b screenshots FETCH_HEAD
          else
            git checkout -q --orphan screenshots
            printf '# screenshots\n\nImages posted by the Screenshot workflow on pull requests. Nothing here is built or shipped.\n' > README.md
          fi
          mkdir -p "$dir"
          cp "${pngs[@]/#/$GITHUB_WORKSPACE/}" "$dir/"
          git add -A && git commit -qm "Screenshots for #$PR (run $GITHUB_RUN_ID)"
          pushed=false
          for delay in 2 4 8 16; do
            if git push -q origin HEAD:screenshots; then pushed=true; break; fi
            sleep "$delay"
            git fetch -q --depth=1 origin screenshots && git rebase -q FETCH_HEAD
          done
          $pushed
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Comment
        if: always()
        uses: actions/github-script@v7
        env:
          PR: ${{ needs.request.outputs.pr }}
          SPECS: ${{ needs.request.outputs.specs }}
          HEAD: ${{ needs.capture.outputs.sha }}
          CAPTURE: ${{ needs.capture.result }}
          PAGES_SHA: ${{ steps.publish.outputs.sha }}
          PAGES_DIR: ${{ steps.publish.outputs.dir }}
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const image = file => `${context.serverUrl}/${owner}/${repo}/blob/${process.env.PAGES_SHA}/${process.env.PAGES_DIR}/${file}?raw=true`;
            const plain = s => s.replace(/[`*_<>[\]]/g, c => '\\' + c);
            // results.json was written next to PR code, so it is only trusted
            // for file names of a known shape; the setup shown comes from SPECS.
            const { specs, errors } = JSON.parse(process.env.SPECS);
            let results = [];
            try { results = JSON.parse(fs.readFileSync('shots/results.json', 'utf8')); } catch {}
            if (!Array.isArray(results)) results = [];
            const png = f => typeof f === 'string' && /^(screenshot|screen)-\d+\.png$/.test(f) ? f : null;
            const text = s => typeof s === 'string' ? s.slice(0, 2000) : '';
            results = results.slice(0, specs.length).map((r, i) => ({
              ...specs[i], title: text(r.title), error: text(r.error), file: png(r.file), screen: png(r.screen),
            }));

            const head = process.env.HEAD ? ` of ${process.env.HEAD.slice(0, 7)}` : '';
            const lines = [`### 📸 Screenshots${head}`, ''];
            for (const e of errors) lines.push(`> [!WARNING]\n> ${plain(e)}`, '');
            if (!results.length) {
              lines.push(`Nothing was captured: the capture job ${process.env.CAPTURE || 'did not run'}. See [the run](${run}).`);
            }
            if (results.some(r => r.file) && !process.env.PAGES_SHA) {
              lines.push(`The images could not be published; they are in [the run](${run})'s artifacts.`, '');
            }
            for (const r of results) {
              const name = plain(r.title || r.window || 'Doctopus');
              if (r.error || !r.file) {
                const error = r.error || 'no image was produced';
                lines.push(`**${name}** — ❌ ${plain(error.split('\n')[0])}`, '');
                const detail = error.split('\n').slice(1).join('\n').replace(/`/g, "'");
                if (detail) lines.push('```', detail, '```', '');
                if (r.screen && process.env.PAGES_SHA) lines.push(`<details><summary>Screen at the time</summary>\n\n![screen](${image(r.screen)})\n</details>`, '');
              } else if (process.env.PAGES_SHA) {
                lines.push(`**${name}**`, '', `![${name}](${image(r.file)})`, '');
              }
              if (r.code) {
                const lang = { sh: 'sh', applescript: 'applescript', jxa: 'js' }[r.lang];
                lines.push(`<details><summary>Setup</summary>\n\n\`\`\`\`${lang}\n${r.code}\n\`\`\`\`\n</details>`, '');
              }
            }
            lines.push(`<sub>[Run](${run}) · \`/screenshot [window title]\` with an optional \`sh\`, \`applescript\` or \`jxa\` setup block</sub>`);
            await github.rest.issues.createComment({ owner, repo, issue_number: Number(process.env.PR), body: lines.join('\n') });
