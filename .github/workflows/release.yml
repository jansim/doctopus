name: Release

# Push a tag such as v1.1 to publish a release. The Homebrew cask
# (jansim/tools/doctopus) installs the latest release's Doctopus.zip.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # The tag, without its "v", becomes the app's version.
      - name: Version
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${GITHUB_REF_NAME#v}" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" Resources/Info.plist

      - name: Build
        run: Scripts/build.sh release -Xswiftc -warnings-as-errors

      - name: Checks
        run: |
          swift Testing/makefixtures.swift Testing/DemoLibrary
          build/Doctopus.app/Contents/MacOS/Doctopus --selftest Testing/DemoLibrary

      # ditto, not zip, keeps the signature and extended attributes intact.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ditto -c -k --keepParent build/Doctopus.app Doctopus.zip
          gh release create "$GITHUB_REF_NAME" Doctopus.zip --generate-notes
